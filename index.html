<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fundflow Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <h1>펀드플로우 증감 현황</h1>
          <span class="unit-note">단위: 조원</span>
        </div>
        <div class="topbar-meta">
          <span id="generatedAt"></span>
          <span id="sourceStatus">데이터 로딩 중</span>
        </div>
      </header>

      <main>
        <section class="summary-strip" aria-label="요약">
          <div class="summary-date">
            <span class="summary-date-label">기준일</span>
            <strong id="latestDate">-</strong>
          </div>
          <div class="sector-strip" id="sectorSummary" aria-label="섹터 요약"></div>
        </section>

        <section class="workbench">
          <section class="dashboard-panel heatmap-panel" aria-label="히트맵">
            <div class="panel-head">
              <div>
                <div class="panel-title-row">
                  <h2>섹터별 히트맵</h2>
                </div>
              </div>
              <div class="legend" aria-label="히트맵 범례">
                <span>감소</span>
                <div class="legend-scale"></div>
                <span>증가</span>
              </div>
            </div>
            <div class="controls table-toolbar" aria-label="필터">
              <label>
                <span>기준일</span>
                <select id="asOfDate"></select>
              </label>
              <label>
                <span>섹터</span>
                <select id="sectorFilter"></select>
              </label>
              <label>
                <span>표시 기간</span>
                <select id="windowSize">
                  <option value="7" selected>최근 7일</option>
                  <option value="15">최근 15일</option>
                  <option value="30">최근 30일</option>
                  <option value="all">전체</option>
                </select>
              </label>
              <label>
                <span>비교 기준</span>
                <select id="compareBasis">
                  <option value="day" selected>전일대비</option>
                  <option value="week">전주대비</option>
                  <option value="month">전월대비</option>
                </select>
              </label>
              <div class="toolbar-tools">
                <button id="compactViewToggle" type="button" aria-pressed="false">간단히 보기</button>
                <button id="resetFilters" type="button">초기화</button>
              </div>
            </div>
            <div class="heatmap-scroll">
              <div id="heatmap" class="heatmap" role="table" aria-label="일별 증감 히트맵"></div>
            </div>
          </section>

          <section class="dashboard-panel trend-panel" aria-label="추이">
            <div class="panel-head">
              <div>
                <h2 id="trendTitle">최근 추이</h2>
                <p id="trendSubtitle">-</p>
              </div>
              <div class="panel-actions trend-actions">
                <div class="trend-mode" role="group" aria-label="추이 종류">
                  <button type="button" data-trend-mode="balance" aria-pressed="true">잔액 추이</button>
                  <button type="button" data-trend-mode="change" aria-pressed="false">증감 추이</button>
                </div>
                <label class="inline-control">
                  <span>선택 항목</span>
                  <select id="itemSelect"></select>
                </label>
                <div class="trend-range" role="group" aria-label="추이 기간 설정">
                  <span>기간</span>
                  <input type="date" id="trendStart" aria-label="추이 시작일" />
                  <span class="range-sep" aria-hidden="true">~</span>
                  <input type="date" id="trendEnd" aria-label="추이 종료일" />
                </div>
                <a id="itemLink" href="#" target="_blank" rel="noreferrer">상세</a>
                <button id="trendToggle" type="button" aria-expanded="true">추이 접기</button>
              </div>
            </div>
            <svg id="trendChart" class="trend-chart" role="img" aria-label="선택 항목 증감 추이"></svg>
          </section>
        </section>
      </main>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
