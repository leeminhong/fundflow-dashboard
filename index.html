<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fundflow Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Daily Fundflow</p>
          <h1>펀드플로우 증감 현황</h1>
        </div>
        <div class="topbar-meta">
          <span id="sourceStatus">데이터 로딩 중</span>
          <span id="generatedAt"></span>
        </div>
      </header>

      <main>
        <section class="summary-grid" aria-label="요약">
          <article class="metric-panel">
            <span class="metric-label">기준일</span>
            <strong id="latestDate">-</strong>
          </article>
          <article class="metric-panel">
            <span class="metric-label">데이터 상태</span>
            <strong id="dataStatus">-</strong>
          </article>
          <article class="metric-panel">
            <span class="metric-label">전체 순증감</span>
            <strong id="totalChange">-</strong>
          </article>
        </section>

        <section class="sector-strip" id="sectorSummary" aria-label="섹터 요약"></section>

        <section class="workbench">
          <aside class="controls" aria-label="필터">
            <label>
              <span>기준일</span>
              <select id="asOfDate"></select>
            </label>
            <label>
              <span>섹터</span>
              <select id="sectorFilter"></select>
            </label>
            <label>
              <span>항목 검색</span>
              <input id="itemSearch" type="search" placeholder="항목명" />
            </label>
            <label>
              <span>표시 기간</span>
              <select id="windowSize">
                <option value="7">최근 7일</option>
                <option value="15" selected>최근 15일</option>
                <option value="30">최근 30일</option>
                <option value="all">전체</option>
              </select>
            </label>
            <label>
              <span>선택 항목</span>
              <select id="itemSelect"></select>
            </label>
            <div class="legend" aria-label="히트맵 범례">
              <span>감소</span>
              <div class="legend-scale"></div>
              <span>증가</span>
            </div>
          </aside>

          <section class="dashboard-panel heatmap-panel" aria-label="히트맵">
            <div class="panel-head">
              <div>
                <h2>섹터별 히트맵</h2>
                <p id="heatmapCaption">-</p>
              </div>
              <div class="panel-actions">
                <button id="compactViewToggle" type="button" aria-pressed="false">간단히 보기</button>
                <button id="resetFilters" type="button">초기화</button>
              </div>
            </div>
            <div class="heatmap-scroll">
              <div id="heatmap" class="heatmap" role="table" aria-label="일별 증감 히트맵"></div>
            </div>
          </section>

          <section class="dashboard-panel trend-panel" aria-label="추이">
            <div class="panel-head">
              <div>
                <h2 id="trendTitle">최근 추이</h2>
                <p id="trendSubtitle">-</p>
              </div>
              <a id="itemLink" href="#" target="_blank" rel="noreferrer">상세</a>
            </div>
            <svg id="trendChart" class="trend-chart" role="img" aria-label="선택 항목 증감 추이"></svg>
          </section>
        </section>
      </main>
    </div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
