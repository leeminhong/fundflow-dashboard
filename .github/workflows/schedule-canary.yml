name: Schedule canary

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Print trigger context
        run: |
          date -u
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
